# -----------------------------------------------------------------------------
# Global & Terminal Settings
# -----------------------------------------------------------------------------
# Set prefix to Ctrl+A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Modern terminal color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -sg escape-time 1

# Enable mouse support
set -g mouse on

# Reload config file easily
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# -----------------------------------------------------------------------------
# Navigation & Pane Management
# -----------------------------------------------------------------------------
# Quick Pane Cycling
unbind ^A
bind ^A select-pane -t :.+

# Splitting panes (retains current directory)
bind | split-window -h -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"

# Selecting panes (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Native Zoom (Replaces old 2.9 hack)
unbind +
bind + resize-pane -Z
unbind -
bind - resize-pane -Z

# -----------------------------------------------------------------------------
# Theme & Visuals (Cleaned up for 3.4 strictness)
# -----------------------------------------------------------------------------
set -g status-style fg=white,bg=black

setw -g window-status-style fg=white,bg=black,dim
setw -g window-status-current-style fg=white,bg=red,bold

set -g pane-border-style fg=green,bg=black
set -g pane-active-border-style fg=white,bg=yellow
